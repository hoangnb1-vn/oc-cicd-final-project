apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-old-test-artifacts
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning generated Python artifacts..."
        rm -rf .pytest_cache __pycache__ tests/__pycache__
        find . -name '*.pyc' -delete
        echo "Cleanup task completed."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: lint-and-test
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir -r requirements.txt
        echo "Lint with flake8"
        python -m flake8 app.py tests
        echo "Run unit tests with nose"
        python -m nose -v
