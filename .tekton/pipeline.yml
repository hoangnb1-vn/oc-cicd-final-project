apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-pipelines-oc-final
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/hoangnb1-vn/oc-cicd-final-project.git
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-hoangnb1/oc-final:latest
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: flake8
      runAfter:
        - git-clone
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: nose
      runAfter:
        - flake8
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: buildah
      runAfter:
        - nose
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      runAfter:
        - buildah
      taskRef:
        name: deploy
      params:
        - name: IMAGE
          value: $(params.image)
